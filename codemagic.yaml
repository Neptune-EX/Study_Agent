workflows:
  macos-build:
    name: Build macOS App with Bundled TeX
    max_build_duration: 60
    instance_type: mac_mini_m2

    scripts:
      - name: Install Python dependencies
        script: |
          set -e
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Build and verify the macOS app
        script: PYTHON_BIN=.venv/bin/python bash scripts/build_macos.sh

    artifacts:
      - dist/macos/MathMistakeBook-macOS.zip
