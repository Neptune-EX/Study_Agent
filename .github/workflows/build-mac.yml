name: Build macOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许你在网页上手动点击按钮打包

jobs:
  build-macos:
    runs-on: macos-15 # 【已修改】使用最新的 Apple Silicon 环境
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate collect_deps.py
        run: |
          # 【新增】动态生成依赖收集文件，防止云端找不到该文件
          cat << 'EOF' > collect_deps.py
          from mistakes import debug, deepseek, download, inputs, latex, launcher, models, selection, store, workflow, worker
          import langchain_openai
          import openai
          import pydantic
          import pymupdf
          import PIL
          import pandas
          import altair
          import jinja2
          EOF

      - name: Build with PyInstaller
        run: |
          # 注意：Mac 下的路径分隔符是冒号 ":"，Windows 是分号 ";"
          pyinstaller collect_deps.py \
            --name "MathMistakeBook" \
            --windowed \
            --onedir \
            --noconfirm \
            --add-data "app.py:." \
            --add-data "paths.py:." \
            --add-data "mistakes:mistakes" \
            --add-data "latex_board:latex_board" \
            --collect-all streamlit \
            --copy-metadata streamlit \
            --hidden-import mistakes.worker

      - name: Package App
        run: |
          cd dist
          zip -r MathMistakeBook-macOS.zip MathMistakeBook.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathMistakeBook-macOS
          path: dist/MathMistakeBook-macOS.zip