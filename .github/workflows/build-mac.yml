name: Build macOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build and verify the macOS app
        run: PYTHON_BIN=python bash scripts/build_macos.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathMistakeBook-macOS
          path: dist/macos/MathMistakeBook-macOS.zip
          if-no-files-found: error
