name: Build macOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许你在网页上手动点击按钮打包

jobs:
  build-macos:
    runs-on: macos-14 # Apple Silicon (M1/M2/M3) 环境
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          # 注意：这里去掉了 texlive，如果你想让用户自己装 MacTeX，就不加 texlive
          pyinstaller collect_deps.py \
            --name "MathMistakeBook" \
            --windowed \
            --onedir \
            --noconfirm \
            --add-data "app.py:." \
            --add-data "paths.py:." \
            --add-data "mistakes:mistakes" \
            --add-data "latex_board:latex_board" \
            --collect-all streamlit \
            --copy-metadata streamlit

      - name: Package App
        run: |
          cd dist
          zip -r MathMistakeBook-macOS.zip MathMistakeBook.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathMistakeBook-macOS
          path: dist/MathMistakeBook-macOS.zip